name: License Check

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    with:
      # this package caps requires-python <3.13 (PGPy/imghdr); the workflow
      # defaults to 3.14, which can't install it.
      python_version: '3.12'
      # usenet and remailers are TigreGotico Apache-2.0 deps installed from git,
      # so the checker can't fetch their license from PyPI and reports "Error".
      # Exclude them (both are Apache-2.0); unioned with the central whitelist.
      exclude_packages: '^(usenet|remailers)$'
