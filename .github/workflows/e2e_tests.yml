name: Hivescope E2E
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11"]'
      # version policy is in pyproject (the `test` extra pulls hivescope);
      # no pre_install pins here.
      install_extras: 'test'
      test_path: 'tests/e2e/'
