name: Hivescope E2E
on:
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
jobs:
  e2e:
    uses: OpenVoiceOS/gh-automations/.github/workflows/build-tests.yml@dev
    with:
      python_versions: '["3.11"]'
      # hivescope's `hivemind-core>=4.0` would otherwise drag stable 4.0.0;
      # pin a published alpha. Drop the pin once these ship stable.
      pre_install_pip: '"hivescope==0.5.0a2" "hivemind-core==4.6.1a1"'
      test_path: 'tests/e2e/'
