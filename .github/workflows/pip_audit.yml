name: PIP Audit

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  pip_audit:
    uses: OpenVoiceOS/gh-automations/.github/workflows/pip-audit.yml@dev
    with:
      # this package caps requires-python <3.13 (PGPy/imghdr); the workflow
      # defaults to 3.14, which can't install it.
      python_version: '3.12'
