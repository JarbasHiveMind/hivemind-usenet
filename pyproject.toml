[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-usenet"
dynamic = ["version"]
description = "HiveMind transport over Usenet: carrier framing, wormhole (NetworkProtocol), and NL bridge"
readme = "README.md"
license = {text = "Apache-2.0"}
# <3.13: PGPy (carrier crypto via usenet/remailers) imports the stdlib
# `imghdr` module, removed in Python 3.13.
requires-python = ">=3.10,<3.13"
dependencies = [
    "usenet>=0.1.0a2",
    "remailers>=0.1.0a2",
    "hivemind-plugin-manager>=0.7.1a1",
    "hivemind_bus_client>=1.0.16a1",
    "hivemind-core>=4.13.18a1",
    "ovos-utils>=0.13.15a1",
    "ovos-bus-client>=2.9.1a1",
    "poorman-handshake>=2.0.0a3",
]

[project.optional-dependencies]
# hivescope = in-process e2e harness used by tests/e2e/. Declared here (not
# pinned in CI). hivescope>=0.5.2a1 floors the bus-client 2.x stack
# (hivemind-core>=4.6.2a1, hivemind-bus-client>=0.9.2a1, ovos-bus-client>=2.0.0a3).
test = ["pytest", "hivescope>=0.8.1a1"]

[project.scripts]
hivemind-usenet-wormhole = "hivemind_usenet.wormhole:main"
hivemind-usenet-bridge   = "hivemind_usenet.bridge:main"
hivemind-usenet-client   = "hivemind_usenet.client:main"

[project.entry-points."hivemind.network.protocol"]
hivemind-usenet-wormhole = "hivemind_usenet.wormhole:UsenetWormhole"

[project.urls]
Homepage = "https://github.com/JarbasHiveMind/hivemind-usenet"

[tool.setuptools]
packages = ["hivemind_usenet"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "hivemind_usenet.version.__version__"}
